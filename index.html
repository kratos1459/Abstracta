<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstracta</title>
<style>
/* VOICE: a precise lab tool; quiet chrome so the figure is the loudest thing on screen
   IDEA: a journal figure board pinned on a stone lab bench
   PICTURE: the live artboard itself, opened mid-use on a sample graphical abstract
   COLOUR and TYPE: white artboard on a cool stone bench, ink #15201c, one cobalt accent; system UI type
   LAYOUT: library left, artboard centre, inspector right; stacks into one column below 760px */
:root{color-scheme:light dark;
--bg:light-dark(#e4e8e6,#0f1213);--panel:light-dark(#ffffff,#171b1d);--ink:light-dark(#15201c,#e5ebe8);--mute:light-dark(#5b6762,#98a49f);
--line:light-dark(#d6dcd9,#2a3134);--soft:light-dark(#f2f4f3,#1f2528);--acc:#2350d8;--acc-ink:#fff;--acc-soft:light-dark(#e5ebfc,#1c2848);--bad:#c92a2a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:272px minmax(0,1fr) 284px;grid-template-rows:52px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;margin-right:8px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.btn{height:34px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.ico{width:34px;padding:0;justify-content:center}
.btn.on{background:var(--acc-soft);border-color:var(--acc)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grow{flex:1}
#zoomv{min-width:58px;justify-content:center}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
#insp{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:10px 10px 0;position:sticky;top:0;background:var(--panel);z-index:2}
.tab{flex:1;height:32px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--mute);font-weight:600}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.pad{padding:10px}
.search{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:6px;position:sticky;top:42px;background:var(--panel);padding:8px 10px;z-index:2;border-bottom:1px solid var(--line)}
.search input,.search select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:0 9px;font-size:14px;width:100%}
h3{font-size:13px;font-weight:650;margin:14px 0 8px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.tile{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:grab;position:relative;overflow:hidden;min-height:0}
.tile:hover{border-color:var(--acc);background:var(--soft)}
.tile svg{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px)}
.tile .lic{position:absolute;right:3px;bottom:2px;font-size:9px;line-height:1;color:var(--mute);font-weight:700}
.more{margin-top:8px;width:100%}
.note{font-size:13px;color:var(--mute);margin:6px 0}
.tpl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tpl:hover{border-color:var(--acc)}.tpl b{display:block;margin-bottom:2px}.tpl span{color:var(--mute);font-size:13px}
#stage{position:relative;overflow:auto;background:radial-gradient(circle,light-dark(#cfd5d2,#22292c) 1px,transparent 1.2px) 0 0/18px 18px}
#board{display:grid;place-items:center;min-width:100%;min-height:100%;width:max-content;padding:70px;position:relative}
#svg{display:block;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 30px rgba(0,0,0,.12);touch-action:none;user-select:none;-webkit-user-select:none}
#svg.clear{background:conic-gradient(#e9e9e9 25%,#fff 0 50%,#e9e9e9 0 75%,#fff 0) 0 0/16px 16px}
#stage.pan,#stage.pan *{cursor:grab!important}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--soft);height:34px;overflow:hidden}
.f span{padding:0 7px;color:var(--mute);font-size:13px;flex:none}
.f input,.f select{border:0;background:transparent;height:100%;width:100%;padding:0 6px 0 0;font-size:14px;outline:none}
.f select{padding-left:6px}
input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel);cursor:pointer;flex:none}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.cl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.pal button{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:4px 0 8px}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
textarea.ta{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px;font-size:14px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.layers{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.layers li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.layers li:hover{background:var(--soft)}.layers li.sel{background:var(--acc-soft)}
.layers i{font-style:normal;color:var(--mute);width:54px;flex:none}
.layers b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.credits{font-size:13px;line-height:1.45;max-height:180px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px;margin-bottom:8px;white-space:pre-wrap}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.keys{font-size:13px;color:var(--mute);line-height:1.9}
#modal{position:fixed;inset:0;background:rgba(10,14,13,.45);display:none;place-items:center;z-index:50;padding:16px}
#modal.open{display:grid}
.dlg{background:var(--panel);border-radius:14px;width:min(460px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 12px;font-size:19px}
.dlg .opts{display:grid;gap:6px;margin-bottom:12px}
.dlg label.o{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
.dlg label.o:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg .px{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#15201c;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#edit{position:absolute;z-index:5;border:1.5px solid var(--acc);background:rgba(255,255,255,.92);color:#000;outline:none;resize:none;padding:0;margin:0;overflow:hidden;line-height:1.25;white-space:pre}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:1000px){.app{grid-template-columns:230px minmax(0,1fr) 250px}}
@media (max-width:760px){body{overflow:auto}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px 62vh auto auto;height:auto}aside{border:0;border-top:1px solid var(--line);max-height:none}#stage{min-height:62vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#2350d8"/><circle cx="9" cy="10" r="3.2" fill="#fff"/><path d="M13 16l3-6 3 6z" fill="#9fe3c7"/><path d="M5 17h7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>Abstracta</div>
  <button class="btn" data-act="new" title="New from template">New</button>
  <button class="btn" data-act="open" title="Open project (.json)">Open</button>
  <button class="btn" data-act="save" title="Save project (.json)">Save</button>
  <span class="sep"></span>
  <button class="btn ico" data-act="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="btn ico" data-act="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  <span class="sep"></span>
  <button class="btn ico" data-act="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button class="btn" id="zoomv" data-act="fit" title="Fit to screen">100%</button>
  <button class="btn ico" data-act="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <span class="grow"></span>
  <button class="btn pri" data-act="export">Export</button>
</header>

<aside id="lib">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="lib">Library</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="tpl">Templates</button>
  </div>
  <div id="libPane">
    <div class="search"><input id="q" type="search" placeholder="Search icons" autocomplete="off"><select id="cat" aria-label="Category"></select></div>
    <div class="pad">
      <label class="chk"><input type="checkbox" id="freeOnly"> Only icons that need no credit</label>
      <div id="libBody"></div>
    </div>
  </div>
  <div id="tplPane" class="pad" hidden></div>
</aside>

<main id="stage"><div id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div></main>

<aside id="insp"></aside>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileImg" accept="image/*" hidden multiple>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<script type="application/json" id="pack">/*ICONPACK*/</script>
<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;
const deg=Math.PI/180;
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)};
const FONTS={sans:'Helvetica Neue, Helvetica, Arial, sans-serif',serif:'Georgia, Times New Roman, serif',round:'Avenir Next, Avenir, Segoe UI, sans-serif',mono:'Menlo, Consolas, monospace'};
const PALETTE=['#15201c','#ffffff','#2350d8','#0072b2','#56b4e9','#009e73','#a6d854','#f0e442','#e69f00','#d55e00','#cc79a7','#c92a2a','#7f8c8d','#e8eef7','#fdf1e3','#eaf6ee'];
const LICNAME={'own':'Abstracta (free, no credit)','cc-0':'CC0','mit':'MIT','bsd':'BSD','cc-by-3.0':'CC BY 3.0','cc-by-4.0':'CC BY 4.0'};
const needsCredit=l=>l==='cc-by-3.0'||l==='cc-by-4.0';

/* ---------- built-in icons (original drawings, free to use) ---------- */
const P=(n,d)=>(+n).toFixed(1);
function virus(){let s='';for(let i=0;i<12;i++){const a=i*30*deg,c=Math.cos(a),n=Math.sin(a);s+=`<line x1="${P(50+28*c)}" y1="${P(50+28*n)}" x2="${P(50+40*c)}" y2="${P(50+40*n)}" stroke="$2" stroke-width="3"/><circle cx="${P(50+43*c)}" cy="${P(50+43*n)}" r="4.5" fill="$2"/>`}
 return s+'<circle cx="50" cy="50" r="30" fill="$1" stroke="$2" stroke-width="3"/><circle cx="41" cy="43" r="5" fill="$3"/><circle cx="58" cy="56" r="4" fill="$3"/><circle cx="55" cy="39" r="3" fill="$3"/>'}
function dna(){let a='',b='',r='';for(let y=4;y<=96;y+=2){const t=(y-4)/92*Math.PI*3,x1=50+24*Math.sin(t),x2=50-24*Math.sin(t);a+=(y===4?'M':'L')+P(x1)+' '+y;b+=(y===4?'M':'L')+P(x2)+' '+y;if((y-4)%8===4)r+=`<line x1="${P(x1)}" y1="${y}" x2="${P(x2)}" y2="${y}" stroke="$3" stroke-width="3"/>`}
 return r+`<path d="${a}" fill="none" stroke="$1" stroke-width="5" stroke-linecap="round"/><path d="${b}" fill="none" stroke="$2" stroke-width="5" stroke-linecap="round"/>`}
function helix(x,y,w,h,a){const cx=x+w/2,cy=y+h/2;let s=`<g transform="rotate(${a} ${cx} ${cy})"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w/2}" fill="$1" stroke="$2" stroke-width="2.5"/>`;for(let k=1;k<5;k++){const yy=y+k*h/5;s+=`<path d="M${x+2} ${yy-3}Q${cx} ${yy+4} ${x+w-2} ${yy-3}" fill="none" stroke="$2" stroke-width="1.6" opacity=".55"/>`}return s+'</g>'}
function membrane(){let s='';for(let i=0;i<10;i++){const x=5+i*10;s+=`<path d="M${x-1.6} 22q-2 6 0 12t0 12M${x+1.6} 22q2 6 0 12t0 12M${x-1.6} 78q-2-6 0-12t0-12M${x+1.6} 78q2-6 0-12t0-12" fill="none" stroke="$2" stroke-width="1.5"/><circle cx="${x}" cy="18" r="4.6" fill="$1" stroke="$2" stroke-width="1.2"/><circle cx="${x}" cy="82" r="4.6" fill="$1" stroke="$2" stroke-width="1.2"/>`}return s}
function receptor(){let s='<rect x="0" y="38" width="100" height="26" fill="$3"/>';for(let x=3;x<100;x+=6.5)s+=`<circle cx="${P(x)}" cy="38" r="3.2" fill="$2" opacity=".35"/><circle cx="${P(x)}" cy="64" r="3.2" fill="$2" opacity=".35"/>`;
 const xs=[20,29,38,47,56,65,74];let loops='M20 30C18 20 10 18 8 10';xs.forEach((x,i)=>{if(i<6){const n=xs[i+1];loops+=i%2===0?`M${x} 72C${x} 82 ${n} 82 ${n} 72`:`M${x} 30C${x} 20 ${n} 20 ${n} 30`}});loops+='M74 72C76 84 86 84 90 92';
 s+=`<path d="${loops}" fill="none" stroke="$2" stroke-width="2.2" stroke-linecap="round"/>`;xs.forEach(x=>s+=`<rect x="${x-3.5}" y="30" width="7" height="42" rx="3.5" fill="$1" stroke="$2" stroke-width="1.5"/>`);
 return s+'<polygon points="47,2 55,11 47,20 39,11" fill="$2"/>'}
function hexmol(){const cx=40,cy=54,R=22,V=[...Array(6)].map((_,k)=>[cx+R*Math.cos((60*k-90)*deg),cy+R*Math.sin((60*k-90)*deg)]);
 const sub=(v,a,len)=>[v[0]+len*Math.cos(a*deg),v[1]+len*Math.sin(a*deg)];
 const o1=sub(V[1],-30,20),o2=sub(V[5],210,20),m3=sub(V[3],90,18);
 let s=`<path d="M${P(V[1][0])} ${P(V[1][1])}L${P(o1[0])} ${P(o1[1])}M${P(V[5][0])} ${P(V[5][1])}L${P(o2[0])} ${P(o2[1])}M${P(V[3][0])} ${P(V[3][1])}L${P(m3[0])} ${P(m3[1])}" stroke="$2" stroke-width="3.5" stroke-linecap="round"/>`;
 s+=`<polygon points="${V.map(p=>P(p[0])+','+P(p[1])).join(' ')}" fill="$1" stroke="$2" stroke-width="3.5" stroke-linejoin="round"/>`;
 for(const[i,j]of[[0,1],[2,3],[4,5]]){const a=V[i],b=V[j],ia=[a[0]+(cx-a[0])*.24,a[1]+(cy-a[1])*.24],ib=[b[0]+(cx-b[0])*.24,b[1]+(cy-b[1])*.24],L=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],s1=L(ia,ib,.15),s2=L(ia,ib,.85);s+=`<line x1="${P(s1[0])}" y1="${P(s1[1])}" x2="${P(s2[0])}" y2="${P(s2[1])}" stroke="$2" stroke-width="3" stroke-linecap="round"/>`}
 return s+`<circle cx="${P(o1[0])}" cy="${P(o1[1])}" r="7" fill="$3"/><circle cx="${P(o2[0])}" cy="${P(o2[1])}" r="7" fill="$3"/>`}
function ring(cx,cy,r,n,fn,off){let s='';for(let i=0;i<n;i++){const a=(i*(360/n)-90+(off||0))*deg;s+=fn(cx+r*Math.cos(a),cy+r*Math.sin(a),Math.cos(a),Math.sin(a))}return s}
function ybcr(cx,cy,r,n,col,L,A,w){L=L||8;A=A||6.5;w=w||2.6;return ring(cx,cy,r,n,(x,y,ux,uy)=>{const px=-uy,py=ux,bx=x+ux*L,by=y+uy*L;
 return `<path d="M${P(x)} ${P(y)}L${P(bx)} ${P(by)}M${P(bx)} ${P(by)}l${P(ux*A+px*A*.8)} ${P(uy*A+py*A*.8)}M${P(bx)} ${P(by)}l${P(ux*A-px*A*.8)} ${P(uy*A-py*A*.8)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`})}
function tcrRing(cx,cy,r,n,col,L){L=L||11;return ring(cx,cy,r,n,(x,y,ux,uy)=>{const px=-uy,py=ux,d=2.5,bx=x+ux*L,by=y+uy*L;
 return `<path d="M${P(x-px*d)} ${P(y-py*d)}L${P(bx-px*d)} ${P(by-py*d)}M${P(x+px*d)} ${P(y+py*d)}L${P(bx+px*d)} ${P(by+py*d)}M${P(bx-px*d*1.7)} ${P(by-py*d*1.7)}L${P(bx+px*d*1.7)} ${P(by+py*d*1.7)}" stroke="${col}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`})}
function smoothClosed(pts){const n=pts.length,mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let m0=mid(pts[n-1],pts[0]),d=`M${P(m0[0])} ${P(m0[1])}`;
 for(let i=0;i<n;i++){const c=pts[i],m=mid(pts[i],pts[(i+1)%n]);d+=`Q${P(c[0])} ${P(c[1])} ${P(m[0])} ${P(m[1])}`}return d+'Z'}
function amoeba(cx,cy,R,lobes,amp){const N=lobes*2,pts=[];for(let i=0;i<N;i++){const a=i*(360/N)*deg,r=R+(i%2?amp:-amp*.5);pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return smoothClosed(pts)}
function dendrites(cx,cy,r,n,col){return ring(cx,cy,r,n,(x,y,ux,uy)=>{const px=-uy,py=ux,bx=x+ux*15,by=y+uy*15;
 return `<path d="M${P(x)} ${P(y)}L${P(bx)} ${P(by)}M${P(bx)} ${P(by)}l${P(ux*8+px*6.5)} ${P(uy*8+py*6.5)}M${P(bx)} ${P(by)}l${P(ux*8-px*6.5)} ${P(uy*8-py*6.5)}" stroke="${col}" stroke-width="3" stroke-linecap="round" fill="none"/>`})}
function beads(x,y,n,r,gap,fill,stroke,hi,hiFill){let s=`<path d="M${P(x)} ${P(y)}H${P(x+(n-1)*gap)}" stroke="${stroke}" stroke-width="2.6"/>`;

 const d=`M${r2(p1[0])} ${r2(p1[1])}Q${r2(g.cx)} ${r2(g.cy)} ${r2(p2[0])} ${r2(p2[1])}`;

  if(o.type==='line'){const g=lineGeo(o);s+=`<line x1="${o.x1}" y1="${o.y1}" x2="${g.hx}" y2="${g.hy}" stroke="${acc}" stroke-width="${z}" stroke-dasharray="${4*z}"/><line x1="${g.hx}" y1="${g.hy}" x2="${o.x2}" y2="${o.y2}" stroke="${acc}" stroke-width="${z}" stroke-dasharray="${4*z}"/>`+hnd(o.x1,o.y1,'p1','#fff')+hnd(o.x2,o.y2,'p2','#fff')+hnd(g.hx,g.hy,'bend',acc)}

/* ---------- history & storage ---------- */
function commit(){const s=JSON.stringify(doc);if(s===lastSnap)return;past.push(lastSnap);if(past.length>120)past.shift();future=[];lastSnap=s;persist();renderCanvas()}
function persist(){try{localStorage.setItem('abstracta.doc',lastSnap)}catch(e){}}
function undo(){if(!past.length)return;future.push(lastSnap);lastSnap=past.pop();doc=JSON.parse(lastSnap);sel=sel.filter(byId);persist();renderAll()}
function redo(){if(!future.length)return;past.push(lastSnap);lastSnap=future.pop();doc=JSON.parse(lastSnap);sel=sel.filter(byId);persist();renderAll()}
function setDoc(d,reset){doc=d;sel=[];if(reset){past=[];future=[]}else if(lastSnap)past.push(lastSnap);lastSnap=JSON.stringify(doc);persist();fit();renderAll()}

/* ---------- binary helpers: CRC32, PNG dpi, TIFF, ZIP ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function buildSVG(pxW,pxH,transparent){const{W,H}=doc;return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${pxW}" height="${pxH}" viewBox="0 0 ${W} ${H}">`+(doc.bg&&!transparent?`<rect width="${W}" height="${H}" fill="${doc.bg}"/>`:'')+doc.objs.map(o=>objSVG(o,false)).join('')+'</svg>'}

let dlP=null;const getDL=()=>{if(!window.claude||typeof window.claude.use!=='function')return Promise.resolve(null);if(!dlP)dlP=window.claude.use('downloads').catch(()=>null);return dlP};

  const one=files.length===1&&!/\.tiff?$/i.test(files[0].name)?files[0]:{name:slug()+'.zip',blob:await zip(files)};
  try{await d.save({filename:one.name,data:one.blob});toast('Saved '+one.name)}catch(e){toast(e&&e.code==='declined'?'Save cancelled':'Could not save ('+((e&&e.code)||'error')+')')}return}
 for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);await new Promise(r=>setTimeout(r,350))}toast('Saved '+files.map(f=>f.name).join(', '))}

  const upd=()=>{const cm=parseFloat(d.querySelector('#ewcm').value)||1,dpi=parseInt(d.querySelector('#edpi').value)||600,w=Math.round(cm/2.54*dpi),h=Math.round(w*doc.H/doc.W);d.querySelector('#epx').textContent=`${w} × ${h} px · ${(cm).toFixed(1)} × ${(cm*doc.H/doc.W).toFixed(1)} cm at ${dpi} dpi`+(w*h>60e6?' · very large, may fail':'');return{w,h,dpi,cm}};

/* ---------- project files ---------- */
function saveProject(){deliver([{name:slug()+'.abstracta.json',blob:new Blob([JSON.stringify(doc)],{type:'application/json'})}])}
function openProject(f){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.objs)||!d.W)throw 0;setDoc(d);toast('Opened '+f.name)}catch(e){toast('That file is not an Abstracta project')}};fr.readAsText(f)}
$('#fileProj').addEventListener('change',e=>{const f=e.target.files[0];if(f)openProject(f);e.target.value=''});

/* ---------- header actions ---------- */
document.querySelector('header').addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
 ({new:()=>{$$('.tab')[1].click()},open:()=>$('#fileProj').click(),save:saveProject,undo,redo,zin:()=>setZoom(zoom*1.25),zout:()=>setZoom(zoom/1.25),fit,export:openExport})[a]?.()});
addEventListener('resize',()=>renderCanvas());

/* ---------- start ---------- */
renderTpl();buildCatSelect();
let start=null;try{start=JSON.parse(localStorage.getItem('abstracta.doc')||'null')}catch(e){}
doc=start&&Array.isArray(start.objs)?start:tplPipeline();lastSnap=JSON.stringify(doc);
renderLib();renderAll();requestAnimationFrame(fit);
const packEl=$('#pack'),raw=packEl.textContent.trim();
if(raw&&!raw.startsWith('/*')){try{loadPack(JSON.parse(raw))}catch(e){toast('Icon library failed to load')}}
else fetch('icons.json').then(r=>r.ok?r.json():Promise.reject()).then(loadPack).catch(()=>{packState='fail';renderLib()});
window.__abstracta={get doc(){return doc},ICONS,renderAll,raster,buildSVG,tiff,pngDpi,zip,addIcon,addShape,selectAll:()=>{sel=doc.objs.map(o=>o.id);renderAll()}};
}
</script>
</body>
</html>
